<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </radialGradient>

    <!-- Ribbon Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/> <!-- Violet -->
      <stop offset="50%" stop-color="#6366f1"/> <!-- Indigo -->
      <stop offset="100%" stop-color="#3b82f6"/> <!-- Blue -->
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/> <!-- Emerald -->
      <stop offset="100%" stop-color="#06b6d4"/> <!-- Cyan -->
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/> <!-- Gold -->
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="8"/>

  <!-- Logo Graphics Group -->
  <g transform="translate(4, 0)">
    <!-- Glow Effect Underlay -->
    <path d="M 120 340 C 120 220, 200 160, 256 240 C 312 320, 392 260, 392 140" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="48" stroke-linecap="round" opacity="0.3" filter="url(#glow)"/>
    <path d="M 120 340 L 190 230 C 220 180, 280 180, 310 230 L 392 360" 
          fill="none" stroke="url(#accentGrad)" stroke-width="40" stroke-linecap="round" opacity="0.3" filter="url(#glow)"/>

    <!-- Main Paths -->
    <!-- Wave 1: The Indigo-Blue Flow (represents Cash Flow) -->
    <path d="M 130 350 C 130 230, 210 170, 256 240 C 302 310, 382 250, 382 130" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wave 2: The Emerald Upward Trend (represents Capital Growth) -->
    <path d="M 130 350 C 180 350, 220 280, 256 240 C 290 200, 330 130, 382 130" 
          fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Connecting Node / Sparkle -->
    <!-- Gold Star (represent wealth achievement) -->
    <g transform="translate(382, 130)" filter="url(#glow)">
      <path d="M 0 -35 L 8 -10 L 33 -10 L 13 5 L 21 30 L 0 15 L -21 30 L -13 5 L -33 -10 L -8 -10 Z" fill="url(#starGrad)"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>
    
    <!-- Floating Coins / Dots -->
    <circle cx="210" cy="280" r="10" fill="#3b82f6" opacity="0.8"/>
    <circle cx="300" cy="200" r="14" fill="#10b981" opacity="0.9"/>
    <circle cx="170" cy="180" r="8" fill="#a855f7" opacity="0.6"/>
  </g>
</svg>
